<article class="wish-card {% if wish.status == 'reserved' %}is-reserved{% endif %}" data-category="{{ wish.category }}" data-price="{{ wish.price }}" data-title="{{ wish.title|lower }} {{ wish.brand|lower }}">
  <div class="wish-image"><img src="{{ wish.image }}" alt="{{ wish.title }}" loading="lazy">{% if wish.status == 'reserved' %}<span class="reserved-tag">уже выбрали ♡</span>{% endif %}</div>
  <div class="wish-body"><p class="wish-brand">{{ wish.brand }}</p><h3>{{ wish.title }}</h3><p class="wish-note">{{ wish.note }}</p><div class="wish-bottom"><strong>{{ wish.price|rubles }}</strong><span class="availability">{% if wish.status == 'available' %}свободно{% else %}занято{% endif %}</span></div><div class="wish-actions"><a class="product-link" href="{{ wish.link }}" target="_blank" rel="noopener">Смотреть товар <span>↗</span></a>{% if wish.status == 'available' %}<button class="reserve-button" type="button" data-reserve data-id="{{ wish.id }}" data-title="{{ wish.title }}" data-price="{{ wish.price|rubles }}">Забронировать</button>{% else %}<span class="reserve-button disabled">Уже выбрано</span>{% endif %}</div></div>
</article>
